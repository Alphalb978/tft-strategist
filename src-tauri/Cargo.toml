[package]
name = "tft-strategist"
version = "0.1.0"
description = "Private TFT pre-game strategist"
edition = "2021"

[lib]
name = "tft_strategist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
